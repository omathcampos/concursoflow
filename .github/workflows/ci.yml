name: CI

on:
  pull_request:
    branches: [develop, master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project
        id: detect
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::package.json ainda não existe (esperado antes da Fase 1) — pulando build/test."
          fi

      - name: Setup Node
        if: steps.detect.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.exists == 'true'
        run: npm ci

      - name: Lint
        if: steps.detect.outputs.exists == 'true'
        run: npm run lint --if-present

      - name: Type check
        if: steps.detect.outputs.exists == 'true'
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          else
            echo "tsconfig.json não encontrado — pulando type check."
          fi

      - name: Unit tests
        if: steps.detect.outputs.exists == 'true'
        run: npm run test --if-present

      - name: Build
        if: steps.detect.outputs.exists == 'true'
        run: npm run build --if-present

      - name: Install Playwright browsers
        if: steps.detect.outputs.exists == 'true'
        run: |
          if npm run | grep -q " e2e"; then
            npx playwright install --with-deps chromium
          else
            echo "Script e2e não encontrado — pulando instalação do Playwright."
          fi

      - name: E2E tests
        if: steps.detect.outputs.exists == 'true'
        run: npm run e2e --if-present
